cache_dir: ${oc.env:STABLEWM_HOME,.}
solver:
  _target_: stable_worldmodel.solver.HierarchicalCEMSolver
  embed_dim: 192
  u_dim: 16
  batch_size: 1
  var_scale: 1.0
  device: cuda
  seed: 42
  u_num_samples: 100
  u_n_steps: 20
  u_topk: 10
  u_horizon: 6
  u_prior_constraint: none
  u_prior_kl_limit: 0.1
  subgoal_rerank_topk: 1
  subgoal_rerank_num_samples: 64
  subgoal_rerank_n_steps: 5
  subgoal_rerank_elite: 8
  subgoal_rerank_weight: 0.5
  subgoal_rerank_normalization: minmax
  subgoal_rerank_refine_steps: 5
  subgoal_rerank_reuse_actions: true
  high_level_guidance_steps: 1
  high_level_start_context: repeat_current
  allow_padded_high_level_start: true
  max_high_level_replans: 3
  final_after_macro_complete: false
  reset_low_level_warm_start_on_objective_change: true
  a_num_samples: 300
  a_n_steps: 30
  a_topk: 30
  high_level_guidance_macro_steps: null
  high_level_replan_interval: 1
  final_receding_horizon: 1
  a_var_scale: 1.25
world:
  env_name: swm/OGBCube-v0
  num_envs: 200
  max_episode_steps: 250
  env_type: single
  ob_type: states
  multiview: false
  width: 224
  height: 224
  visualize_info: false
  terminate_at_goal: true
dataset:
  stats: cube_planning_o100.h5
  keys_to_cache:
  - action
seed: 42
policy: ${oc.env:DUALWM_CHECKPOINT_DIR,./checkpoints}/CubeCPT/CubeCPT.pt
plan_config:
  horizon: 5
  receding_horizon: 1
  action_block: 5
  warm_start: true
eval:
  num_eval: 200
  sample_num_eval: 200
  task_offset: 0
  env_batch_size: 1
  reuse_env_batches: false
  goal_offset_steps: 100
  eval_budget: 125
  img_size: 224
  dataset_name: cube_planning_o100.h5
  callables:
  - method: set_state
    args:
      qpos:
        value: qpos
      qvel:
        value: qvel
  - method: set_target_pos
    args:
      cube_id:
        value: 0
        in_dataset: false
      target_pos:
        value: goal_privileged_block_0_pos
      target_quat:
        value: goal_privileged_block_0_quat
output:
  filename: outputs/cube_o100.json
subgoal_cost:
  mode: dynamic_window_aligned
high_level_goal_cost:
  mode: lift_mse
defaults:
- override hydra/job_logging: disabled
hydra:
  output_subdir: null
  run:
    dir: .
